name: Bug Report
description: Create a report to help us improve PRPath
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can maintainers reproduce this bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment Info
      description: Node version, OS, browser, AI provider.
    validations:
      required: false
